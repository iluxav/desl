[workspace]
resolver = "2"
members = [
    "crates/desl",
    "crates/desl-daemon",
    "crates/desl-proto",
    "crates/desl-ir",
    "crates/desl-web",
    "crates/adapters/claude",
    "crates/adapters/codex",
    "crates/adapters/copilot",
]

[workspace.package]
version = "0.2.1"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
desl-ir = { path = "crates/desl-ir" }
desl-proto = { path = "crates/desl-proto" }
desl-daemon = { path = "crates/desl-daemon" }
desl-web = { path = "crates/desl-web" }
adapter-claude = { path = "crates/adapters/claude" }
adapter-codex = { path = "crates/adapters/codex" }
adapter-copilot = { path = "crates/adapters/copilot" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
ratatui = "0.30"
unicode-width = "0.2"
pulldown-cmark = { version = "0.13.6", default-features = false }
portable-pty = "0.9"
filedescriptor = "0.8"
rustix = { version = "1", features = ["fs", "net", "process", "termios"] }
vt100 = "0.18"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
rusqlite = { version = "0.37", features = ["bundled"] }
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }
# desl web only (web-spec.md "Architecture"): the daemon and the TUI stay on threads.
tokio = { version = "1", features = ["rt", "net", "io-util", "macros", "sync", "time", "signal"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "ws"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.dev]
opt-level = 1

[profile.release]
strip = true
