[workspace]
resolver = "2"
members = [
    "crates/desl",
    "crates/desl-daemon",
    "crates/desl-proto",
    "crates/desl-ir",
    "crates/adapters/claude",
    "crates/adapters/codex",
]
# The phase 0 prototype is its own workspace, kept only as the reference for the client.
exclude = ["phase0"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
desl-ir = { path = "crates/desl-ir" }
desl-proto = { path = "crates/desl-proto" }
desl-daemon = { path = "crates/desl-daemon" }
adapter-claude = { path = "crates/adapters/claude" }
adapter-codex = { path = "crates/adapters/codex" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
ratatui = "0.30"
unicode-width = "0.2"
pulldown-cmark = { version = "0.13.6", default-features = false }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
rusqlite = { version = "0.37", features = ["bundled"] }
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.dev]
opt-level = 1

[profile.release]
strip = true
