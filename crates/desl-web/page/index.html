<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>desl</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/vendor/xterm.css">
<link rel="stylesheet" href="/app.css">
<script type="module" src="/app.js"></script>
</head>
<body>
<header class="top">
  <span class="brand">desl</span>
  <span class="crumb">workspace</span>
  <span class="grow"></span>
  <span id="waiting-pill" class="pill" hidden></span>
  <span id="link" class="link" data-state="connecting"><span class="dot" aria-hidden="true"></span><span id="link-text">connecting</span></span>
</header>

<div class="cols">
  <nav id="projects" class="side" aria-label="Projects"></nav>
  <div id="grip-side" class="grip" role="separator" aria-orientation="vertical" aria-controls="projects" aria-label="Width of the projects column" tabindex="0" title="Drag to resize; double-click for the usual width"></div>
  <main class="main">
    <div id="head" class="head"></div>
    <div class="tabs" role="tablist" aria-label="What the thread shows">
      <button id="tab-screen" type="button" role="tab" class="tab" aria-selected="true" aria-controls="screen-pane">Screen</button>
      <button id="tab-conv" type="button" role="tab" class="tab" aria-selected="false" aria-controls="conv-pane">Conversation</button>
    </div>
    <div class="pane">
      <div id="conv-pane" class="conv-pane" role="tabpanel" aria-labelledby="tab-conv" hidden>
        <div class="conv-tools">
          <input id="conv-find" type="search" aria-label="Find in the conversation" placeholder="Find in the conversation">
          <span id="conv-count" class="conv-count"></span>
          <label class="conv-toggle"><input id="conv-tools" type="checkbox" checked> Tool calls</label>
        </div>
        <div id="conv" class="conv"></div>
      </div>
      <div id="screen-pane" class="screen-pane" role="tabpanel" aria-labelledby="tab-screen">
        <div id="screen" class="screen"></div>
      </div>
      <div id="screen-note" class="screen-note" role="status" hidden>
        <p id="screen-note-text"></p>
        <button id="screen-again" type="button" class="secondary" hidden>Start it again</button>
      </div>
    </div>
  </main>
  <div id="grip-wait" class="grip" role="separator" aria-orientation="vertical" aria-controls="wait" aria-label="Width of the waiting list" tabindex="0" title="Drag to resize; double-click for the usual width"></div>
  <aside id="wait" class="wait" aria-labelledby="wait-title">
    <h2 id="wait-title" class="label">Waiting</h2>
    <div id="waitlist" class="waitlist"></div>
  </aside>
</div>

<footer id="composer" class="composer">
  <form id="prompt-form" autocomplete="off">
    <span class="caret" aria-hidden="true">›</span>
    <input id="prompt" type="text" aria-label="Prompt" placeholder="Pick a thread" disabled>
    <button id="send" type="submit" class="primary" disabled>Send</button>
  </form>
  <p id="notice" class="notice" role="status" aria-live="polite"></p>
</footer>

<div id="nokey" class="nokey" hidden>
  <div class="nokey-box">
    <h1>This page needs its key</h1>
    <p>Run <code>desl web</code> in a terminal and open the address it prints. The key is the part after <code>#t=</code>, and it changes each time desl web starts.</p>
  </div>
</div>
</body>
</html>
