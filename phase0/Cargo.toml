[workspace]
resolver = "2"
members = ["proto-a"]

[workspace.package]
edition = "2024"
publish = false

[workspace.dependencies]
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
unicode-width = "0.2"

[profile.dev]
opt-level = 1

[profile.release]
debug = 1
