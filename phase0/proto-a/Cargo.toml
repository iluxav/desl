[package]
name = "proto-a"
version = "0.0.0"
edition.workspace = true
publish.workspace = true
description = "desl phase 0, prototype A: the rendered experience. Throwaway."

[lib]
name = "proto_a"
path = "src/lib.rs"

[[bin]]
name = "proto-a"
path = "src/bin/proto-a.rs"

[[bin]]
name = "proto-b"
path = "src/bin/proto-b.rs"

[[bin]]
name = "desl-proto"
path = "src/bin/desl-proto.rs"

[dependencies]
ratatui = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
unicode-width = { workspace = true }
vt100 = "0.18"
portable-pty = "0.9"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
pulldown-cmark = { version = "0.13.6", default-features = false }
